spring.config.import=kafka.yaml,prometheus.yaml

spring.application.name=venue-and-menu-service
server.servlet.context-path=/api

menu.pdf.dir=src/main/resources/menu
menu.fonts.path=classpath:fonts/NotoSans.ttf
menu.css.path=classpath:styles/menu.css

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.profiles.active=${SPRING_PROFILE:default}