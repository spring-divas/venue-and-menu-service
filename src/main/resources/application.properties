spring.config.import=kafka.yaml
spring.application.name=venue-and-menu-service
server.servlet.context-path=/api
server.port=8080

menu.pdf.dir=src/main/resources/menu
menu.fonts.path=classpath:fonts/NotoSans.ttf
menu.css.path=classpath:styles/menu.css

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.profiles.active=${SPRING_PROFILE:default}

management.tracing.sampling.probability=1.0
management.endpoint.health.probes.enabled=true
management.observations.annotations.enabled=true
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,metrics,prometheus
management.tracing.propagation.type=w3c
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}