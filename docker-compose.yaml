services:
  venue-db:
    image: postgres:18-alpine
    container_name: venue-db-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - venue-db-data:/var/lib/postgresql
    networks:
      - venue-network

  venue-service:

    build:
      context: .
      dockerfile: Dockerfile
    container_name: venue-service-container
    restart: on-failure:3
    environment:
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8080}
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MENU_PDF_DIR: /workdir/menu
      SPRING_GRPC_SERVER_PORT: ${SPRING_GRPC_SERVER_PORT:-9090}
      DISH_SYNC_TRANSPORT: ${DISH_SYNC_TRANSPORT:-grpc}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTLP_TRACES_ENDPOINT: ${OTLP_TRACES_ENDPOINT}
      SPRING_PROFILE: ${SPRING_PROFILE}
    ports:
      - "${SERVER_HOST_PORT}:8080"
      - "${GRPC_HOST_PORT}:9090"
    depends_on:
      venue-db:
        condition: service_healthy
    networks:
      - venue-network
      - feedo

volumes:
  venue-db-data:

networks:
  venue-network:
    driver: bridge
  feedo:
    name: feedo
    driver: bridge
