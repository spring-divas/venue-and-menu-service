services:
  venue-db:
    image: postgres:18-alpine
    container_name: venue-db-container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - venue-db-data:/var/lib/postgresql
    networks:
      - venue-network

  venue-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venue-service-container
    restart: on-failure:3
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SERVER_HOST_PORT}:8080"
    depends_on:
      venue-db:
        condition: service_healthy
    networks:
      - venue-network

volumes:
  venue-db-data:

networks:
  venue-network:
    driver: bridge