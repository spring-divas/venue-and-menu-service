apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: venue-service
  template:
    metadata:
      labels:
        app: venue-service
    spec:
      containers:
        - name: venue-service-container
          image: venue-service:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: venue-secret
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 7
---
apiVersion: v1
kind: Service
metadata:
  name: venue-service
spec:
  selector:
    app: venue-service
  ports:
    - port: 8080
